<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임 대기실 - 방 목록</title>
    <!-- 웹소켓 STOMP 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<h2>🏠 게임 대기실 (Lobby)</h2>
<p>내 정보: <b id="myInfo">불러오는 중...</b></p>
<button onclick="logout()">로그아웃</button>

<hr>

<!-- 1. 방 만들기 -->
<fieldset style="margin-bottom: 20px;">
    <legend><b>새 방 만들기</b></legend>
    <form id="createRoomForm">
        <div>
            <label>방 제목: </label>
            <input type="text" id="roomTitle" placeholder="즐거운 음악 퀴즈" required>
        </div>
        <div style="margin-top: 5px;">
            <label>최대 인원수: </label>
            <input type="number" id="maxParticipants" value="8" min="2" max="10" required>
        </div>
        <button type="submit" style="margin-top: 10px;">방 생성</button>
    </form>
</fieldset>

<!-- 2. 대기실 방 목록 (실시간 갱신) -->
<fieldset>
    <legend><b>대기실 방 목록 (실시간 자동 갱신 중)</b></legend>
    <button onclick="fetchRooms()">🔄 수동 새로고침</button>

    <table border="1" style="width: 100%; margin-top: 10px; text-align: center;">
        <thead>
        <tr>
            <th>방 번호</th>
            <th>방 제목</th>
            <th>인원 수</th>
            <th>상태</th>
            <th>입장</th>
        </tr>
        </thead>
        <tbody id="roomListTable">
        <tr>
            <td colspan="5">생성된 방이 없습니다. 방을 만들어보세요!</td>
        </tr>
        </tbody>
    </table>
</fieldset>

<script>
    const API_BASE = 'http://localhost:8080/api/rooms';

    // localStorage에서 유저 정보 불러오기
    const userId = localStorage.getItem('userId');
    const nickname = localStorage.getItem('nickname');

    // 로그인 정보가 없으면 로그인 화면으로 튕기기
    if (!userId) {
        alert("로그인이 필요합니다.");
        window.location.href = 'login.html';
    } else {
        document.getElementById('myInfo').innerText = `${nickname} (ID: ${userId})`;
    }

    let stompClient = null;

    // 페이지 로드 시 실행
    window.onload = function() {
        fetchRooms();     // 1. 최초 REST API 방 목록 조회
        connectLobbySocket(); // 2. 실시간 방 목록 갱신용 웹소켓 연결 (/topic/lobby)
    };

    // ================= 1. REST API 관련 함수 =================

    // 최초/수동 방 목록 불러오기
    async function fetchRooms() {
        try {
            const response = await fetch(API_BASE);
            if (response.ok) {
                const rooms = await response.json();
                renderRoomList(rooms);
            }
        } catch (error) {
            console.error("방 목록 불러오기 실패:", error);
        }
    }

    // 방 목록 HTML 테이블 렌더링
    function renderRoomList(rooms) {
        const tbody = document.getElementById('roomListTable');
        tbody.innerHTML = '';

        if (!rooms || rooms.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">생성된 방이 없습니다. 방을 만들어보세요!</td></tr>';
            return;
        }

        rooms.forEach(room => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${room.roomId}</td>
                <td>${room.title}</td>
                <td>${room.currentParticipants || 1} / ${room.maxParticipants}</td>
                <td>${room.status || 'WAITING'}</td>
                <td>
                    <button onclick="enterRoom(${room.roomId})">입장하기</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 방 생성 요청
    document.getElementById('createRoomForm').addEventListener('submit', async (e) => {
    e.preventDefault();

        const createData = {
        hostUserId: parseInt(userId),
        roomName: document.getElementById('roomTitle').value,
        maxPlayers: parseInt(document.getElementById('maxParticipants').value),
        password: "",       // 비밀방 미사용 시 빈 값
        genre: "ALL",       // 기본 장르 (필요시 폼에서 선택받도록 추가 가능)
        musicCount: 10,     // 기본 문제 수
        startYear: 1990,    // 기본 시작 연도
        endYear: 2026       // 기본 종료 연도
    };

        try {
        const response = await fetch(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(createData)
        });

        if (response.ok) {
            const roomResponse = await response.json();
            alert(`방이 생성되었습니다! (방 번호: ${roomResponse.roomId})`);

            // 방 생성 후 해당 게임방(game.html)으로 이동
            window.location.href = `game.html?roomId=${roomResponse.roomId}`;
        } else {
            const errorMsg = await response.text();
            alert("방 생성 실패: " + errorMsg);
        }
    } catch (error) {
        console.error("방 생성 에러:", error);
    }
});

    // 방 입장 요청
    async function enterRoom(roomId) {
        try {
            const response = await fetch(`${API_BASE}/${roomId}/enter?userId=${userId}`, {
                method: 'POST'
            });

            if (response.ok) {
                // 입장 성공 시 인게임 방(game.html)으로 이동
                window.location.href = `game.html?roomId=${roomId}`;
            } else {
                const errorMsg = await response.text();
                alert("입장 실패: " + errorMsg);
            }
        } catch (error) {
            console.error("입장 에러:", error);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // ================= 2. 실시간 웹소켓 관련 (로비 구독) =================

    function connectLobbySocket() {
        // 백엔드의 WebSocket endpoint 설정 (/ws 또는 /ws-stomp)
        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // 콘솔 로그 지저분하면 비활성화

        stompClient.connect({}, function (frame) {
            console.log('로비 웹소켓 연결 성공!');

            // 로비 채널 구독: 누군가 방을 만들거나 입/퇴장하면 최신 방 목록이 이쪽으로 날아옴
            stompClient.subscribe('/topic/lobby', function (message) {
                const updatedRooms = JSON.parse(message.body);
                console.log('실시간 방 목록 수신:', updatedRooms);
                renderRoomList(updatedRooms); // 실시간 화면 갱신!
            });
        }, function (error) {
            console.error('웹소켓 연결 실패:', error);
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AZIT MUZIK CLUB - 대기실</title>
    <link rel="stylesheet" href="club.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<header class="club-header">
    <div class="brand-logo">AZIT MUZIK CLUB</div>
    <div class="user-profile-bar">
        <!-- 닉네임 클릭 시 내정보(마이페이지) 연결 예정 -->
        <span class="welcome-text"><b id="myInfo" onclick="location.href='mypage.html'" style="cursor: pointer;">불러오는 중...</b>님 환영합니다!</span>
        <button class="neon-btn neon-btn-dark" onclick="logout()">로그아웃</button>
    </div>
</header>

<div class="club-container">

    <main class="main-content">
        <div class="content-header">
            <div class="section-title">ROOMS</div>
            <div>
                <button class="neon-btn neon-btn-cyan" onclick="fetchRooms()">🔄 새로고침</button>
                <button class="neon-btn neon-btn-pink" onclick="openCreateModal()">+ 새 방 만들기</button>
            </div>
        </div>

        <div class="table-container">
            <table class="club-table">
                <thead>
                <tr>
                    <th>NO</th>
                    <th>방 제목</th>
                    <th>장르</th>
                    <th>인원</th>
                    <th>상태</th>
                    <th>입장</th>
                </tr>
                </thead>
                <tbody id="roomListTable">
                <tr>
                    <td colspan="6">생성된 방이 없습니다. 방을 만들어보세요!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

    <aside class="sidebar">
        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>FRIENDS</span>
            <button class="neon-btn neon-btn-dark" style="padding: 4px 10px; font-size: 12px;" onclick="location.href='friend.html'">관리 ⚙️</button>
        </div>

        <div class="friend-list" id="friendList">
            <div style="color: #888; font-size: 13px; text-align: center; padding: 20px 0;">친구 목록 불러오는 중...</div>
        </div>
    </aside>

</div>

<div class="modal-overlay" id="createRoomModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 20px; color: #FF007F;">새 게임방 만들기</h3>
        <form id="createRoomForm">
            <div class="form-group">
                <label>방 제목</label>
                <input type="text" id="roomName" class="form-control" placeholder="방제목은 필수입니다!" required>
            </div>
            <div class="form-group">
                <label>최대 인원수</label>
                <input type="number" id="maxPlayers" class="form-control" value="4" min="2" max="8" required>
            </div>
            <div class="form-group" style="display: none;">
                <label>비밀번호</label>
                <input type="password" id="password" class="form-control" value="">
            </div>
            <div class="form-group">
                <label>장르</label>
                <select id="genre" class="form-control">
                    <option value="발라드">발라드</option>
                    <option value="K-POP">K-POP</option>
                    <option value="투니버스">투니버스</option>
                </select>
            </div>
            <div class="form-group">
                <label>문제 개수</label>
                <select id="musicCount" class="form-control">
                    <option value="10" selected>10 문제</option>
                    <option value="15">15 문제</option>
                    <option value="20">20 문제</option>
                    <option value="30">30 문제</option>
                </select>
            </div>
            <div class="form-group">
                <label>발매 연도 범위</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="number" id="startYear" class="form-control" value="1990" min="1970" max="2026"> 년 ~
                    <input type="number" id="endYear" class="form-control" value="2026" min="1970" max="2026"> 년
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button type="button" class="neon-btn neon-btn-dark" style="flex: 1;" onclick="closeCreateModal()">취소</button>
                <button type="submit" class="neon-btn neon-btn-pink" style="flex: 1;">방 생성하기</button>
            </div>
        </form>
    </div>
</div>

<script src="config.js"></script>
<script src="lobby.js"></script>
<script>
    // 모달 제어 전용 소형 함수
    function openCreateModal() {
        document.getElementById('createRoomModal').style.display = 'flex';
    }
    function closeCreateModal() {
        document.getElementById('createRoomModal').style.display = 'none';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임 대기실</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<h2>MUZIK 대기실</h2>
<p>내 정보: <b id="myInfo">불러오는 중...</b></p>
<button onclick="location.href='mypage.html'">내 정보</button>
<button onclick="location.href='friend.html'">친구 관리</button>
<button onclick="logout()">로그아웃</button>

<hr>

<fieldset style="margin-bottom: 20px;">
    <legend><b>새 게임방 만들기</b></legend>
    <form id="createRoomForm">
        <div style="margin-bottom: 8px;">
            <label>방 제목: </label>
            <input type="text" id="roomName" required>
        </div>
        <div style="margin-bottom: 8px;">
            <label>최대 인원수: </label>
            <input type="number" id="maxPlayers" value="4" min="2" max="8" required> 명
        </div>
        <div style="margin-bottom: 8px;">
<!--            <label>비밀번호: </label>-->
            <input type="password" id="password" placeholder="비밀방 설정 시 입력 (선택)">
        </div>
        <div style="margin-bottom: 8px;">
            <label>장르: </label>
            <select id="genre">
<!--                <option value="ALL">전체</option>-->
                <option value="발라드">발라드</option>
                <option value="K-POP">K-POP</option>
                <option value="투니버스">투니버스</option>
            </select>
        </div>
        <div style="margin-bottom: 8px;">
            <label>문제 개수: </label>
            <select id="musicCount">
                <option value="10" selected>10 문제</option>
                <option value="15">15 문제</option>
                <option value="20">20 문제</option>
                <option value="30">30 문제</option>
            </select>
        </div>
        <div style="margin-bottom: 8px;">
            <label>발매 연도 범위: </label>
            <input type="number" id="startYear" value="1990" min="1970" max="2026" style="width: 70px;"> 년 ~
            <input type="number" id="endYear" value="2026" min="1970" max="2026" style="width: 70px;"> 년
        </div>

        <button type="submit" style="margin-top: 10px;">방 생성하기</button>
    </form>
</fieldset>

<fieldset>
    <legend><b>대기실 방 목록 (실시간 자동 갱신 중)</b></legend>
    <button onclick="fetchRooms()">새로고침</button>

    <table border="1" style="width: 100%; margin-top: 10px; text-align: center;">
        <thead>
        <tr>
            <th>방 번호</th>
            <th>방 제목</th>
            <th>장르</th>
            <th>인원 수</th>
            <th>상태</th>
            <th>입장</th>
        </tr>
        </thead>
        <tbody id="roomListTable">
        <tr>
            <td colspan="6">생성된 방이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</fieldset>

<script src="lobby.js"></script>
<script src="config.js"></script>
</body>
</html>

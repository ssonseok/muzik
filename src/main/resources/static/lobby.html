<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임 대기실 - 방 목록</title>
    <!-- 웹소켓 STOMP 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<h2>🏠 게임 대기실 (Lobby)</h2>
<p>내 정보: <b id="myInfo">불러오는 중...</b></p>
<button onclick="location.href='mypage.html'">마이페이지 (전적보기)</button>
<button onclick="location.href='friend.html'">👥 친구 관리</button>
<button onclick="logout()">로그아웃</button>

<hr>

<!-- 1. 방 만들기 (모든 설정 포함) -->
<fieldset style="margin-bottom: 20px;">
    <legend><b>새 게임방 만들기</b></legend>
    <form id="createRoomForm">
        <div style="margin-bottom: 8px;">
            <label>방 제목: </label>
            <input type="text" id="roomName" required>
        </div>
        <div style="margin-bottom: 8px;">
            <label>최대 인원수: </label>
            <input type="number" id="maxPlayers" value="4" min="2" max="8" required> 명
        </div>
        <div style="margin-bottom: 8px;">
<!--            <label>비밀번호: </label>-->
            <input type="password" id="password" placeholder="비밀방 설정 시 입력 (선택)">
        </div>
        <div style="margin-bottom: 8px;">
            <label>장르: </label>
            <select id="genre">
<!--                <option value="ALL">전체 장르</option>-->
                <option value="발라드">발라드</option>
                <option value="K-POP">K-POP</option>
                <option value="투니버스">투니버스</option>
<!--                <option value="힙합">힙합 / R&B</option>-->
<!--                <option value="OST">OST / 애니 / 영화</option>-->
<!--                <option value="POP">POP</option>-->
<!--                <option value="ROCK">록 / Band</option>-->
            </select>
        </div>
        <div style="margin-bottom: 8px;">
            <label>문제 개수: </label>
            <select id="musicCount">
                <option value="10" selected>10 문제</option>
                <option value="15">15 문제</option>
                <option value="20">20 문제</option>
                <option value="30">30 문제</option>
            </select>
        </div>
        <div style="margin-bottom: 8px;">
            <label>발매 연도 범위: </label>
            <input type="number" id="startYear" value="1990" min="1970" max="2026" style="width: 70px;"> 년 ~
            <input type="number" id="endYear" value="2026" min="1970" max="2026" style="width: 70px;"> 년
        </div>

        <button type="submit" style="margin-top: 10px;">방 생성하기</button>
    </form>
</fieldset>

<!-- 2. 대기실 방 목록 (실시간 자동 갱신) -->
<fieldset>
    <legend><b>대기실 방 목록 (실시간 자동 갱신 중)</b></legend>
    <button onclick="fetchRooms()">🔄 수동 새로고침</button>

    <table border="1" style="width: 100%; margin-top: 10px; text-align: center;">
        <thead>
        <tr>
            <th>방 번호</th>
            <th>방 제목</th>
            <th>장르</th>
            <th>인원 수</th>
            <th>상태</th>
            <th>입장</th>
        </tr>
        </thead>
        <tbody id="roomListTable">
        <tr>
            <td colspan="6">생성된 방이 없습니다. 방을 만들어보세요!</td>
        </tr>
        </tbody>
    </table>
</fieldset>

<script>
    const SERVER_URL = 'http://localhost:8080';
    const API_BASE = `${SERVER_URL}/api/rooms`;

    const userId = localStorage.getItem('userId');
    const nickname = localStorage.getItem('nickname');

    if (!userId) {
        alert("로그인이 필요합니다.");
        window.location.href = 'login.html';
    } else {
        document.getElementById('myInfo').innerText = `${nickname} (ID: ${userId})`;
    }

    let stompClient = null;

    window.onload = function() {
        fetchRooms();
        connectLobbySocket();
    };

    // 방 목록 불러오기 (REST API)
    async function fetchRooms() {
        try {
            const response = await fetch(API_BASE);
            if (response.ok) {
                const rooms = await response.json();
                renderRoomList(rooms);
            }
        } catch (error) {
            console.error("방 목록 불러오기 실패:", error);
        }
    }

    // 방 목록 HTML 테이블 렌더링
function renderRoomList(rooms) {
    const tbody = document.getElementById('roomListTable');
    tbody.innerHTML = '';

    if (!rooms || rooms.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">생성된 방이 없습니다. 방을 만들어보세요!</td></tr>';
        return;
    }

    rooms.forEach(room => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${room.roomId}</td>
            <td>${room.roomName}</td>
            <td>${room.genre || '전체'}</td>
            <td><b>${room.currentPlayers} / ${room.maxPlayers}</b></td>
            <td>${room.roomStatus || 'WAITING'}</td>
            <td>
                <button onclick="enterRoom(${room.roomId})">입장하기</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

    // 방 생성 요청
    document.getElementById('createRoomForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const createData = {
            hostUserId: parseInt(userId),
            roomName: document.getElementById('roomName').value,
            maxPlayers: parseInt(document.getElementById('maxPlayers').value),
            password: document.getElementById('password').value,
            genre: document.getElementById('genre').value,
            musicCount: parseInt(document.getElementById('musicCount').value),
            startYear: parseInt(document.getElementById('startYear').value),
            endYear: parseInt(document.getElementById('endYear').value)
        };

        try {
            const response = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(createData)
            });

            if (response.ok) {
                const roomResponse = await response.json();
                alert(`방이 생성되었습니다! (방 번호: ${roomResponse.roomId})`);
                window.location.href = `game.html?roomId=${roomResponse.roomId}`;
            } else {
                const errorMsg = await response.text();
                alert("방 생성 실패: " + errorMsg);
            }
        } catch (error) {
            console.error("방 생성 에러:", error);
        }
    });

    // 방 입장 요청
    async function enterRoom(roomId) {
        try {
            const response = await fetch(`${API_BASE}/${roomId}/enter?userId=${userId}`, {
                method: 'POST'
            });

            if (response.ok) {
                window.location.href = `game.html?roomId=${roomId}`;
            } else {
                const errorMsg = await response.text();
                alert("입장 실패: " + errorMsg);
            }
        } catch (error) {
            console.error("입장 에러:", error);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // 로비 웹소켓 구독
    function connectLobbySocket() {
        const socket = new SockJS(`${SERVER_URL}/ws`);
        stompClient = Stomp.over(socket);

        // STOMP 디버그 로그 끄기 (필요시 주석 해제)
        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            console.log("로비 웹소켓 연결 성공!");

            stompClient.subscribe('/topic/lobby', function (message) {
                console.log("로비 실시간 데이터 수신:", message.body);
                const updatedRooms = JSON.parse(message.body);
                renderRoomList(updatedRooms);
            });
        }, function(error) {
            console.error("로비 웹소켓 연결 에러:", error);
        });
    }

</script>
</body>
</html>

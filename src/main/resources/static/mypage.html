<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
</head>
<body>

<h1>마이페이지</h1>
<hr>

<div>
    <p>닉네임: <b id="nickname">로딩 중...</b></p>
    <p>총 게임 수: <span id="totalGames">0</span> 판</p>
    <p>승리 횟수(1위): <span id="winCount">0</span> 회</p>
    <p>승률: <span id="winRate">0</span> %</p>
    <p>최고 점수: <span id="maxScore">0</span> 점</p>
</div>

<br>
<button onclick="location.href='lobby.html'">로비로 돌아가기</button>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const userId = localStorage.getItem('userId');

        if (!userId) {
            alert("로그인 정보가 없습니다.");
            window.location.href = 'lobby.html';
            return;
        }

        try {
            const response = await fetch(`/api/users/${userId}/stats`);
            if (response.ok) {
                const data = await response.json();
                document.getElementById('nickname').innerText = data.nickname;
                document.getElementById('totalGames').innerText = data.totalGames;
                document.getElementById('winCount').innerText = data.winCount;
                document.getElementById('winRate').innerText = data.winRate;
                document.getElementById('maxScore').innerText = data.maxScore;
            } else {
                alert("전적 정보를 불러오지 못했습니다.");
            }
        } catch (error) {
            console.error("마이페이지 조회 에러:", error);
        }
    });
</script>

</body>
</html>

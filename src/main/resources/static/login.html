<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>

<h2>🎵 뮤직 퀴즈 - 로그인</h2>

<form id="loginForm">
    <div style="margin-bottom: 10px;">
        <label>아이디: </label>
        <input type="text" id="username" required>
    </div>
    <div style="margin-bottom: 10px;">
        <label>비밀번호: </label>
        <input type="password" id="password" required>
    </div>

    <button type="submit">로그인</button>
    <button type="button" onclick="location.href='signup.html'">회원가입 하러가기</button>
</form>

<!--<div id="resultMessage" style="margin-top: 15px; color: red;"></div>-->

<script src="login.js">

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="cinema.css">
</head>
<body>

<div class="auth-container">
    <div class="brand-sub">Midnight Cinema</div>
    <h1 class="brand-title">MUZIK</h1>
    <p class="phrase">서비스 이용을 위해 로그인해 주세요.</p>

    <form id="loginForm" class="auth-form">
        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <div class="button-group-vertical">
            <button type="submit" class="btn btn-login">로그인</button>
            <button type="button" class="btn btn-guest" onclick="location.href='signup.html'">회원가입</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <a href="#" onclick="history.back()" class="nav-back-link">← 이전 페이지로 돌아가기</a>
    </div>
</div>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>

<h2>🎵 뮤직 퀴즈 - 로그인</h2>

<form id="loginForm">
    <div style="margin-bottom: 10px;">
        <label>아이디: </label>
        <input type="text" id="username" required>
    </div>
    <div style="margin-bottom: 10px;">
        <label>비밀번호: </label>
        <input type="password" id="password" required>
    </div>

    <button type="submit">로그인</button>
    <button type="button" onclick="location.href='signup.html'">회원가입 하러가기</button>
</form>

<!--<div id="resultMessage" style="margin-top: 15px; color: red;"></div>-->

<script>
    const BASE_URL = 'http://localhost:8080/api/users';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginData = {
            loginId: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch(`${BASE_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            if (response.ok) {
                const result = await response.json();

                if (typeof result === 'object') {
                    localStorage.setItem('userId', result.userId);
                    localStorage.setItem('nickname', result.nickname);
                } else {
                    localStorage.setItem('userId', result);
                    localStorage.setItem('nickname', loginData.loginId); // 임시로 아이디를 닉네임으로 저장
                }

                alert(`로그인 성공!`);
                window.location.href = 'lobby.html';
            } else {
                const errorText = await response.text();
                alert(errorText || "아이디 또는 비밀번호가 올바르지 않습니다.");
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버 연결 실패');
        }
    });
</script>
</body>
</html>

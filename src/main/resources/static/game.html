<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임방 - 뮤직 퀴즈</title>
    <!-- 웹소켓 STOMP & YouTube IFrame API -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<h2>🎵 뮤직 퀴즈 - 게임방 <span id="roomTitle"></span></h2>
<div>
    <span>접속자: <b id="myInfo"></b></span> |
    <button onclick="leaveRoom()" style="background-color: #ffcccc;">방 나가기</button>
</div>

<hr>

<!-- 1. 방장 전용 게임 시작 버튼 & 게임 정보 -->
<div style="margin-bottom: 15px; background-color: #f0f0f0; padding: 10px; border-radius: 5px;">
    <button id="startBtn" onclick="sendStart()" style="font-weight: bold; padding: 5px 15px;">🎮 게임 시작</button>
    <span id="gameStatusText" style="margin-left: 10px; color: darkblue; font-weight: bold;">대기 중...</span>
</div>

<!-- 2. 유튜브 플레이어 (오디오 재생용) -->
<div id="playerContainer" style="display: none;">
    <div id="youtubePlayer"></div>
</div>

<!-- 3. 실시간 채팅 / 정답 입력 & 스킵 영역 -->
<fieldset style="margin-bottom: 15px;">
    <legend><b>실시간 채팅 및 정답 입력</b></legend>

    <!-- 채팅 메시지 창 -->
    <div id="chatBox" style="width: 100%; height: 250px; border: 1px solid #ccc; overflow-y: scroll; padding: 5px; background-color: #fafafa; box-sizing: border-box;">
        <p style="color: gray;">[알림] 게임방에 입장하셨습니다. 채팅으로 정답을 맞혀보세요!</p>
    </div>

    <!-- 입력 폼 & 스킵 버튼 -->
    <form id="chatForm" style="margin-top: 10px; display: flex; gap: 5px;">
        <input type="text" id="chatInput" placeholder="정답 또는 채팅 메시지 입력..." style="flex: 1;" autocomplete="off" required>
        <button type="submit">전송</button>
        <button type="button" onclick="sendSkip()" style="background-color: #ffe680;">⏭️ 과반수 스킵</button>
    </form>
</fieldset>

<script>
    const API_BASE = 'http://localhost:8080/api/rooms';

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = parseInt(urlParams.get('roomId'));

    // 💡 다중 탭 테스트를 위해 sessionStorage 사용
    const userId = parseInt(localStorage.getItem('userId'));
        const nickname = localStorage.getItem('nickname');

    if (!roomId || !userId) {
        alert("잘못된 접근입니다. 다시 로그인해 주세요.");
        window.location.href = 'login.html';
    } else {
        document.getElementById('myInfo').innerText = `${nickname} (ID: ${userId})`;
        document.getElementById('roomTitle').innerText = `#${roomId}`;
    }

    let stompClient = null;
    let ytPlayer = null;
    let isPlayerReady = false;

    // --- 1. YouTube API 초기화 ---
    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('youtubePlayer', {
            height: '0',
            width: '0',
            events: {
                'onReady': function() { isPlayerReady = true; }
            }
        });
    }

    // --- 2. 페이지 로드 시 웹소켓 연결 ---
    window.onload = function() {
        connectGameSocket();
    };

    // --- 3. 게임방 웹소켓 연결 (/topic/rooms/{roomId}) ---
    function connectGameSocket() {
        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            console.log('게임방 웹소켓 연결 성공!');

            // 서버가 브로드캐스팅하는 /topic/rooms/{roomId} 구독
            stompClient.subscribe(`/topic/rooms/${roomId}`, function (message) {
                const msgData = JSON.parse(message.body);
                handleIncomingMessage(msgData);
            });

            // 💡 백엔드 @MessageMapping("/game/chat") 및 ChatMessageDto 규격에 맞춰 ENTER 메시지 전송
            stompClient.send('/app/game/chat', {}, JSON.stringify({
                type: 'ENTER',
                roomId: roomId,
                senderId: userId,
                sender: nickname,
                message: `${nickname}님이 입장하셨습니다.`
            }));

        }, function (error) {
            console.error('게임방 웹소켓 연결 에러:', error);
        });
    }

    // --- 4. 서버 수신 메시지 처리 (`processedMessage`) ---
    function handleIncomingMessage(data) {
        const chatBox = document.getElementById('chatBox');

        // A. 채팅 및 시스템 메시지 출력 (ChatMessageDto: message, sender)
        if (data.message) {
            const p = document.createElement('p');
            p.style.margin = "3px 0";

            if (data.type === 'TALK') {
                p.innerHTML = `<b>[${data.sender || '알림'}]</b>: ${data.message}`;
            } else if (data.type === 'ANSWER_CORRECT') {
                p.style.color = "green";
                p.style.fontWeight = "bold";
                p.innerHTML = `🎉 [정답] ${data.message}`;
            } else if (data.type === 'SKIP_VOTE' || data.type === 'SKIP') {
                p.style.color = "orange";
                p.innerHTML = `⏭️ ${data.message}`;
            } else if (data.type === 'ENTER' || data.type === 'LEAVE') {
                p.style.color = "gray";
                p.innerHTML = `<i>${data.message}</i>`;
            } else {
                p.innerText = data.message;
            }

            chatBox.appendChild(p);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // B. 유튜브 음악 재생 (백엔드에서 youtubeId를 내려주는 경우)
        if (data.youtubeId && isPlayerReady) {
            console.log("유튜브 재생 시작 - ID:", data.youtubeId);
            ytPlayer.loadVideoById(data.youtubeId);
            ytPlayer.playVideo();

            if (data.round) {
                document.getElementById('gameStatusText').innerText = `🎵 ${data.round}라운드 진행 중!`;
            }
        }

        // C. 게임 종료
        if (data.type === 'GAME_OVER') {
            if (ytPlayer && isPlayerReady) ytPlayer.stopVideo();
            document.getElementById('gameStatusText').innerText = "🏆 게임이 종료되었습니다!";
        }
    }

    // --- 5. 메시지 전송 함수 (백엔드 /app/game/chat 으로 통합 전송) ---

    // A. 일반 채팅 및 정답 입력
    document.getElementById('chatForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const content = input.value.trim();

        if (content && stompClient) {
            stompClient.send('/app/game/chat', {}, JSON.stringify({
                type: 'TALK',
                roomId: roomId,
                senderId: userId,
                sender: nickname,
                message: content
            }));
            input.value = '';
        }
    });

    // B. 게임 시작 (START)
    function sendStart() {
        if (stompClient) {
            stompClient.send('/app/game/chat', {}, JSON.stringify({
                type: 'START',
                roomId: roomId,
                senderId: userId,
                sender: nickname,
                message: '게임 시작'
            }));
        }
    }

    // C. 과반수 스킵 투표 (SKIP)
    function sendSkip() {
        if (stompClient) {
            stompClient.send('/app/game/chat', {}, JSON.stringify({
                type: 'SKIP',
                roomId: roomId,
                senderId: userId,
                sender: nickname,
                message: '스킵 투표'
            }));
        }
    }

    // D. 방 나가기
    async function leaveRoom() {
        try {
            await fetch(`${API_BASE}/${roomId}/leave?userId=${userId}`, { method: 'POST' });
        } catch (e) {
            console.error(e);
        } finally {
            if (stompClient) stompClient.disconnect();
            window.location.href = 'lobby.html';
        }
    }
</script>
</body>
</html>

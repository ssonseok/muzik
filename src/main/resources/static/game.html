<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AZIT MUZIK - 게임방</title>
    <link rel="stylesheet" href="club.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<header class="club-header">
    <div class="brand-logo">AZIT MUZIK <span id="roomTitle" style="display: none;"></span></div>
    <div class="user-profile-bar">
        <span class="welcome-text">Player: <b id="myInfo">불러오는 중...</b></span>
        <button class="neon-btn neon-btn-dark" onclick="leaveRoom()" style="border-color: #FF007F; color: #FF007F;">방 나가기</button>
    </div>
</header>

<div class="game-container">

    <div class="game-control-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="startBtn" class="neon-btn neon-btn-pink" onclick="sendStart()">🎮 게임 시작</button>
            <span id="gameStatusText" class="status-badge">대기 중...</span>
        </div>

        <div class="volume-control">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="changeVolume(this.value)">
            <span id="volumeValue" style="min-width: 40px; font-size: 13px;">50%</span>
        </div>
    </div>

    <div id="playerContainer" style="display: none;">
        <div id="youtubePlayer"></div>
    </div>

    <div class="chat-container">
        <div class="section-title" style="margin-bottom: 12px;">💬 LIVE CHAT & ANSWER</div>

        <div id="chatBox" class="chat-box">
            <div class="chat-notice">
                <strong style="color: #FF007F;">[알림]</strong> 안녕하세요! 모든 음악의 정답은 한글로만 입력해 주셔야 합니다.
                띄어쓰기는 상관없습니다!<br>
                style="color: #AAA;">(예: Gee -> 지, / Touch My Body -> 터치마이바디 or 터치 마이 바디)<br>
                빠른 시일 내에 영문 정답도 인식될 수 있도록 기능 업데이트하겠습니다. 감사합니다.
            </div>
        </div>

        <form id="chatForm" class="chat-form">
            <input type="text" id="chatInput" class="chat-input" placeholder="정답 또는 채팅 메시지 입력..." autocomplete="off" required>
            <button type="submit" class="neon-btn neon-btn-pink">전송</button>
            <button type="button" class="neon-btn neon-btn-yellow" onclick="sendSkip()">스킵</button>
        </form>
    </div>

</div>

<script src="config.js"></script>
<script src="game.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Muzik 퀴즈 게임 테스트 룸</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; background: white; border-radius: 5px; }
        #chatArea { height: 200px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; background: #fafafa; }
        .system { color: #888; font-style: italic; }
        .answer { color: green; font-weight: bold; }
        .end { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h2>🎵 Muzik 게임 실시간 연동 테스트 통합 창</h2>

<div class="box">
    <h3>1단계: 웹소켓 접속 및 방 입장</h3>
    <label>DB에 있는 유저 닉네임: </label>
    <input type="text" id="sender" value="참여자꼬북이" placeholder="DB의 nickname 입력">
    <label> 테스트할 방 ID (Room ID): </label>
    <input type="number" id="roomId" value="1" style="width: 50px;">
    <button onclick="connectAndEnter()">접속 및 입장 (ENTER)</button>
</div>

<div class="box">
    <h3>2단계: 게임 진행 제어</h3>
    <button onclick="startGame()" style="background: #4CAF50; color: white; padding: 5px 15px;">🚀 게임 시작 (START)</button>
    <button onclick="skipCurrent()" style="background: #FF9800; color: white; padding: 5px 15px;">⏩ 곡 스킵 (SKIP)</button>
</div>

<div class="box">
    <h3>3단계: 실시간 채팅 / 정답 입력</h3>
    <div id="chatArea"></div>
    <br>
    <input type="text" id="messageInput" placeholder="정답 또는 대화를 입력하세요..." style="width: 300px;" onkeypress="if(event.keyCode==13) sendMessage()">
    <button onclick="sendMessage()">전송</button>
</div>

<div class="box">
    <h3>4단계: 유튜브 오디오 플레이어 상태</h3>
    <div id="player"></div>
</div>

<script>
    let stompClient = null;
    let currentRoomId = 1;
    let currentSender = "";
    let player = null;

    // 1. 유튜브 iframe API 로드
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 유튜브 플레이어 초기화 (소리만 들리게 200x200 크기로 띄움. 실제 서비스에선 0x0)
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '200',
            width: '350',
            videoId: '', // 처음엔 비워둠
            playerVars: { 'autoplay': 1, 'controls': 1 }
        });
    }

    // 2. 웹소켓 연결 및 방 구독 (ENTER 신호 포함)
    function connectAndEnter() {
        currentRoomId = document.getElementById('roomId').value;
        currentSender = document.getElementById('sender').value;

        // 백엔드의 웹소켓 엔드포인트(/ws)로 SockJS 연결
        let socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            appendChat("System", "백엔드 웹소켓 서버에 연결되었습니다!", "system");

            // 해당 방 번호의 채널을 구독 (백엔드가 보내는 메시지 귀 기울이기)
            stompClient.subscribe('/topic/rooms/' + currentRoomId, function (response) {
                let msg = JSON.parse(response.body);
                handleIncomingMessage(msg);
            });

            // 연결 성공하자마자 백엔드 서비스로 ENTER 패킷 전송
            stompClient.send("/app/game/chat", {}, JSON.stringify({
                roomId: currentRoomId,
                sender: currentSender,
                message: "",
                type: "ENTER"
            }));

        }, function (error) {
            alert("웹소켓 연결 실패! 서버가 켜져 있는지 확인하세요.");
        });
    }

    // 3. 백엔드에서 실시간으로 날아온 메시지(신호) 처리 센터
    function handleIncomingMessage(msg) {
        if (msg.type === "START") {
            appendChat("System", "📢 게임이 시작되었습니다! 첫 번째 곡이 재생됩니다.", "system");
            // 백엔드가 준 유튜브 ID로 음악 바로 재생!!
            if(player && msg.message) player.loadVideoById(msg.message);
        }
        else if (msg.type === "ANSWER_AND_NEXT") {
            appendChat("정답 발생", msg.message, "answer");
            // 정답 맞췄으니 다음 라운드 유튜브 ID로 자동 교체!!
            let nextYoutubeId = msg.message.split("새로운 곡의 유튜브 ID: ")[1]?.trim();
            if(player && nextYoutubeId) player.loadVideoById(nextYoutubeId);
        }
        else if (msg.type === "SKIP_AND_NEXT") {
            appendChat("스킵 발생", msg.message, "system");
            let nextYoutubeId = msg.message.split("새로운 유튜브 ID: ")[1]?.trim();
            if(player && nextYoutubeId) player.loadVideoById(nextYoutubeId);
        }
        else if (msg.type === "GAME_END") {
            appendChat("게임 종료", msg.message, "end");
            if(player) player.stopVideo(); // 노래 끄기
        }
        else {
            // 일반 TALK 잡담 및 오답들
            appendChat(msg.sender, msg.message, "");
        }
    }

    // 4. 메시지 및 정답 전송 (TALK)
    function sendMessage() {
        let input = document.getElementById('messageInput');
        if (!input.value.trim() || !stompClient) return;

        stompClient.send("/app/game/chat", {}, JSON.stringify({
            roomId: currentRoomId,
            sender: currentSender,
            message: input.value,
            type: "TALK"
        }));
        input.value = "";
    }

    // 5. 방장의 게임 시작 요청 (START)
    function startGame() {
        if(!stompClient) return alert("먼저 접속 및 입장 버튼을 누르세요.");
        stompClient.send("/app/game/chat", {}, JSON.stringify({
            roomId: currentRoomId,
            sender: currentSender,
            message: "",
            type: "START"
        }));
    }

    // 6. 라운드 스킵 요청 (SKIP)
    function skipCurrent() {
        if(!stompClient) return alert("게임 진행 중이 아닙니다.");
        stompClient.send("/app/game/chat", {}, JSON.stringify({
            roomId: currentRoomId,
            sender: currentSender,
            message: "",
            type: "SKIP"
        }));
    }

    // 채팅창에 텍스트 그려주는 헬퍼 함수
    function appendChat(sender, text, className) {
        let chatArea = document.getElementById('chatArea');
        let p = document.createElement('p');
        if(className) p.className = className;
        p.innerText = sender + ": " + text;
        chatArea.appendChild(p);
        chatArea.scrollTop = chatArea.scrollHeight;
    }
</script>
</body>
</html>

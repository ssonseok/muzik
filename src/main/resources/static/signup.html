<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<h2>MUZIK - 회원가입</h2>

<form id="signupForm">
    <div style="margin-bottom: 10px;">
        <label>아이디: </label>
        <input type="text" id="username" required>
    </div>
    <div style="margin-bottom: 10px;">
        <label>비밀번호: </label>
        <input type="password" id="password" required>
    </div>
    <div style="margin-bottom: 10px;">
        <label>닉네임: </label>
        <input type="text" id="nickname" required>
    </div>

    <button type="submit">완료</button>
    <button type="button" onclick="location.href='login.html'">로그인 화면으로 돌아가기</button>
</form>

<script src="signup.js">

</script>
<script src="config.js"></script>
</body>
</html>

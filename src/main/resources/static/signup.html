<div class="auth-container">
    <div class="brand-sub">suckerson's</div>
    <h1 class="brand-title">AZIT</h1>
    <p class="phrase">서비스 이용을 위해 회원가입 부탁드립니다!</p>

    <form id="signupForm" class="auth-form">
        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <div class="input-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" placeholder="닉네임을 입력하세요" required>
        </div>

        <div class="button-group-vertical">
            <button type="submit" class="btn btn-login">회원가입 완료</button>
            <button type="button" class="btn btn-guest" onclick="navigateTo('login')">로그인 화면으로 돌아가기</button>
        </div>
    </form>
</div>

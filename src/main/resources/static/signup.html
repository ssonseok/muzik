<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<h2>🎵 뮤직 퀴즈 - 회원가입</h2>

<form id="signupForm">
    <div style="margin-bottom: 10px;">
        <label>아이디: </label>
        <input type="text" id="username" required>
    </div>
    <div style="margin-bottom: 10px;">
        <label>비밀번호: </label>
        <input type="password" id="password" required>
    </div>
    <div style="margin-bottom: 10px;">
        <label>닉네임: </label>
        <input type="text" id="nickname" required>
    </div>

    <button type="submit">회원가입 완료</button>
    <!-- login.html로 돌아가는 링크/버튼 -->
    <button type="button" onclick="location.href='login.html'">로그인 화면으로 돌아가기</button>
</form>

<div id="resultMessage" style="margin-top: 15px; color: red;"></div>

<script>
    const BASE_URL = 'http://localhost:8080/api/users';

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const signupData = {
            loginId: document.getElementById('username').value,
            password: document.getElementById('password').value,
            nickname: document.getElementById('nickname').value
        };

        try {
            const response = await fetch(`${BASE_URL}/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(signupData)
            });

            const resultText = await response.text();

            if (response.ok) {
                alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
                // 가입 성공 시 로그인 페이지(login.html)로 이동
                window.location.href = 'login.html';
            } else {
                document.getElementById('resultMessage').innerText = "오류: " + resultText;
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버 연결 실패');
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAFIA</title>

    <link rel="stylesheet" href="mafiaRoom.css">
</head>

<body>

<div id="mafiaGame">

    <!-- ================================
         HEADER
    ================================= -->
    <header class="game-header">

        <div class="header-title">
            <h1>🕵 MAFIA</h1>
        </div>

        <div class="header-status">
            <span id="playerCount">0명</span>
            <span id="gamePhase">WAITING</span>
            <span id="timer">00:00</span>
        </div>

        <div class="header-user">
            <span id="myNickname">-</span>
            <button id="leaveRoomBtn">나가기</button>
        </div>

    </header>


    <!-- ================================
         MAIN
    ================================= -->
    <main class="game-main">

        <!-- ============================
             LEFT COLUMN
        ============================= -->
        <section class="left-column">

            <!-- PLAYERS -->
            <section class="players-panel panel">

                <h2>PLAYERS</h2>

                <div id="playerList"></div>

            </section>


            <!-- MY INFO -->
            <section class="my-info-panel panel">

                <h2>MY INFO</h2>

                <div class="my-info-row">
                    <span>닉네임</span>
                    <strong id="myInfoNickname">-</strong>
                </div>

                <div class="my-info-row">
                    <span>상태</span>
                    <strong id="myAliveStatus">-</strong>
                </div>

                <div class="my-info-row">
                    <span>직업</span>
                    <strong id="myRole">-</strong>
                </div>

                <div id="hostArea">
                    <button id="startGameBtn">
                        게임 시작
                    </button>
                </div>

            </section>

        </section>


        <!-- ============================
             CENTER COLUMN
        ============================= -->
        <section class="chat-column">

            <!-- GENERAL CHAT -->
            <section class="chat-panel panel">

                <h2>💬 CHAT</h2>

                <div id="chatMessages"></div>

                <div class="chat-input-area">

                    <input
                            type="text"
                            id="chatInput"
                            placeholder="메시지를 입력하세요."
                    >

                    <button id="chatSendBtn">
                        전송
                    </button>

                </div>

            </section>


            <!-- MAFIA CHAT -->
            <section
                    id="mafiaChatArea"
                    class="mafia-chat-panel panel"
                    style="display: none;"
            >

                <h2>🔴 MAFIA CHAT</h2>

                <div id="mafiaChatMessages"></div>

                <div class="chat-input-area">

                    <input
                            type="text"
                            id="mafiaChatInput"
                            placeholder="마피아에게만 보입니다."
                    >

                    <button id="mafiaChatSendBtn">
                        전송
                    </button>

                </div>

            </section>

        </section>


        <!-- ============================
             RIGHT COLUMN
             GAME AREA
        ============================= -->
        <section
                class="game-area-panel panel"
                id="gameAreaPanel"
        >

            <h2 id="gameAreaTitle">
                GAME AREA
            </h2>


            <!-- 기본 메시지 -->
            <div id="gameMessage"></div>


            <!-- ========================
                 NIGHT
            ========================= -->
            <div
                    id="nightArea"
                    style="display: none;"
            >

                <h3>
                    🌙
                    <span id="nightRound">1</span>번째 밤
                </h3>

                <div id="nightTimer">
                    00:30
                </div>

                <p id="nightRoleMessage"></p>

                <div id="nightTargetArea"></div>

                <button id="nightActionBtn">
                    행동하기
                </button>

            </div>


            <!-- ========================
                 DAY
            ========================= -->
            <div
                    id="dayArea"
                    style="display: none;"
            >

                <h3>☀️ 낮</h3>

                <div id="dayTimer">
                    00:00
                </div>

                <p>
                    자유롭게 토론하세요.
                </p>

            </div>


            <!-- ========================
                 VOTE
            ========================= -->
            <div
                    id="voteArea"
                    style="display: none;"
            >

                <h3>⚖ 투표</h3>

                <div id="voteTimer">
                    00:00
                </div>

                <p>
                    처형할 사람을 선택하세요.
                </p>

                <div id="voteTargetArea"></div>

                <button id="voteBtn">
                    투표하기
                </button>

            </div>


            <!-- ========================
                 DEFENSE
            ========================= -->
            <div
                    id="defenseArea"
                    style="display: none;"
            >

                <h3>🛡 반론</h3>

                <div id="defenseTimer">
                    00:00
                </div>

                <p id="defenseQuestion"></p>

                <button id="defenseAgreeBtn">
                    찬성
                </button>

                <button id="defenseDisagreeBtn">
                    반대
                </button>

            </div>

        </section>

    </main>

</div>


<!-- ================================
     SCRIPTS
================================= -->

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script src="mafiaRoom.js"></script>

</body>
</html>

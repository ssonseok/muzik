<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>친구 관리</title>
</head>
<body>

<h2>친구 관리 페이지</h2>
<p>내 정보: <b id="myInfo">불러오는 중...</b></p>
<button onclick="location.href='lobby.html'">로비로 돌아가기</button>

<hr>

<fieldset style="margin-bottom: 20px;">
    <legend><b>친구 요청 보내기</b></legend>
    <input type="text" id="targetNickname">
    <button onclick="sendFriendRequest()">요청 보내기</button>
</fieldset>

<fieldset style="margin-bottom: 20px;">
    <legend><b>받은 친구 요청</b></legend>
    <button onclick="fetchReceivedRequests()">새로고침</button>
    <table border="1" style="width: 100%; margin-top: 10px; text-align: center;">
        <thead>
        <tr>
            <th>요청 ID</th>
            <th>보낸 사람 (닉네임)</th>
            <th>수락</th>
        </tr>
        </thead>
        <tbody id="receivedRequestTable">
        <tr>
            <td colspan="3">불러오는 중...</td>
        </tr>
        </tbody>
    </table>
</fieldset>

<fieldset>
    <legend><b>내 친구 목록</b></legend>
    <button onclick="fetchFriendList()">새로고침</button>
    <table border="1" style="width: 100%; margin-top: 10px; text-align: center;">
        <thead>
        <tr>
            <th>친구 ID</th>
            <th>닉네임</th>
            <th>접속 상태</th>
        </tr>
        </thead>
        <tbody id="friendListTable">
        <tr>
            <td colspan="3">불러오는 중...</td>
        </tr>
        </tbody>
    </table>
</fieldset>

<script src="friend.js"></script>
<script src="config.js"></script>
</body>
</html>
